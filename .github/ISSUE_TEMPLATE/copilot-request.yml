name: GitHub Copilot - ansökan
description: Ansök om tillgång till GitHub Copilot
title: "Copilot ansökan - [ditt namn]"
labels: ["copilot-request"]
assignees:
  - aikidokan
body:
  - type: input
    id: github_user_boss
    attributes:
      label: Din chefs e-postadress
      description: Ange din chefs e-postadress
      placeholder: namn@skogforsk.se
    validations:
      required: true
  - type: input
    id: github_username
    attributes:
      label: GitHub-användarnamn
      description: Ange ditt GitHub-användarnamn. Detta används för kopplingen till din Entra-post och Copilot-seat (t.ex. aikidokan)
      placeholder: aikidokan
    validations:
      required: true

  - type: input
    id: work_email
    attributes:
      label: Skogforsk e-postadress
      description: Ange din Skogforsk e-postadress. Detta är nyckeln vi använder för att hitta rätt Entra-användare och sätta Copilot-attributen.
      placeholder: namn@skogforsk.se
    validations:
      required: true

  - type: textarea
    id: entra_mapping_note
    attributes:
      label: Notering för Entra-koppling
      description: Om din GitHub-identitet inte matchar din Skogforsk-e-post direkt, skriv kort hur du brukar kallas internt så att rätt Entra-användare kan mappas.
      placeholder: 'T.ex. "GitHub: aikidokan, Skogforsk-identitet: Patrick Livbom"'
      render: text
    validations:
      required: false

  - type: dropdown
    id: prior-experience
    attributes:
      label: Tidigare erfarenhet
      description: Har du tidigare erfarenhet av att använda GitHub Copilot?
      options:
        - Ja
        - Nej
      default: 1
    validations:
      required: true

  - type: textarea
    id: purpose
    attributes:
      label: Syfte
      description: Kort beskrivning av hur du kommer använda Copilot och vad du ser för möjligheter med det i ditt arbete.
      placeholder: T.ex. utveckling i .NET, Python, Azure automation...
      render: text
    validations:
      required: true
